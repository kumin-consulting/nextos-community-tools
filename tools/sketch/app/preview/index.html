<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch - preview harness</title>
    <link rel="stylesheet" href="/files/build/app.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fbfbfa;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #16171b;
        }
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #preview-error {
        font: 13px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        padding: 24px;
        color: #c2372b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="preview-error" hidden></pre>
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script src="/stub-sdk.js"></script>
    <script type="module">
      const show = (err) => {
        const box = document.getElementById('preview-error');
        box.hidden = false;
        box.textContent = String((err && err.stack) || err);
      };
      window.addEventListener('error', (e) => show(e.error ?? e.message));
      window.addEventListener('unhandledrejection', (e) => show(e.reason));
      try {
        const mod = await import('/files/build/app.js');
        window.__sketchModule = mod;
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(mod.default));
        window.__sketchReady = true;
      } catch (err) {
        show(err);
      }
    </script>
  </body>
</html>
